name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One group per PR, so a new push cancels the PR's older run. Each push to
  # main gets its own group: in a shared group, a newer run would cancel a
  # pending one, and that commit would never be checked.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Skip installing the git hooks; CI never commits.
          HUSKY: 0

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check the MSAL redirect bridge copy
        run: npm run check:msal-bridge

      # Migration of saved characters, and the fairy-door pairing rules.
      - name: Migration and map-data tests
        run: |
          npm run test:migration
          npm run test:map-data
