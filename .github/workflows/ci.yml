name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One group per PR, so a new push cancels the PR's older run. Each push to
  # main gets its own group: in a shared group, a newer run would cancel a
  # pending one, and that commit would never be checked.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Skip installing the git hooks; CI never commits.
          HUSKY: 0

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check the MSAL redirect bridge copy
        run: npm run check:msal-bridge

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Skip installing the git hooks; CI never commits.
          HUSKY: 0

      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The browsers are cached per Playwright version, and saved as soon as
      # they're installed, so a failing test run still keeps them.
      - name: Restore the browsers
        id: browsers
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install the browsers and their system libraries
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Save the browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}

      - name: Install the browsers' system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      # Builds the app and serves it (webServer in playwright.config.ts).
      - name: Run the browser tests
        run: npm run test:e2e

      - name: Upload the report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # `npm run audit:known-issues`: its own job so its minutes run beside the
  # browser tests rather than after them (see "Browser Tests" in AGENTS.md).
  known-issues-audit:
    name: Known issues audit
    runs-on: ubuntu-latest
    # Longer than the test's own 20-minute timeout, so a slow walk is reported by
    # Playwright — with the entries that matched nothing — rather than killed by
    # the runner with no output at all. It also has npm ci, a cold browser
    # install and a build to fit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Skip installing the git hooks; CI never commits.
          HUSKY: 0

      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The browser-tests job's cache, read only: it holds both browsers, and
      # this job needs Chromium. It never saves, so a cold cache costs it an
      # install but can't leave that job with a Chromium-only cache.
      - name: Restore the browsers
        id: browsers
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install the browser and its system libraries
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install the browsers' system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Builds the app and serves it (webServer in playwright.config.ts), then
      # walks the matrix once to fail on a known-issue entry that matched nothing.
      - name: Audit the known issues
        run: npm run audit:known-issues

      # The one long test is traced too, and this is where its trace is useful.
      - name: Upload the report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: known-issues-audit-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
