<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dolmen Spot mark: a capstone resting on two standing stones, in gold on
       a dark tile so it reads on light and dark tab strips. Every edge sits on
       an even coordinate, so it lands on whole pixels at 16, 32 and 48 px.
       After editing, run `node scripts/generate-icons.mjs` to rebuild
       favicon.ico and apple-icon.png. -->
  <rect width="32" height="32" rx="6" fill="#1a1a2e"/>
  <g fill="#c4a35a">
    <path d="M2 10 6 6H28L30 8V12L28 14H2Z"/>
    <rect x="6" y="12" width="6" height="14"/>
    <rect x="20" y="12" width="6" height="14"/>
  </g>
</svg>
